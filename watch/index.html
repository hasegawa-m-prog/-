<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>なぜ『失う痛み』は得るより二倍なのか</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .cover {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 28px;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.15), rgba(0,0,0,0.72));
      border: 0;
      color: #fff;
      cursor: pointer;
    }
    .cover[hidden] { display: none; }
    .mark {
      width: 78px;
      height: 78px;
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .mark i {
      display: block;
      width: 0;
      height: 0;
      margin-left: 4px;
      border-left: 22px solid #fff;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
    }
    h1 {
      margin: 0;
      max-width: 16em;
      font-size: clamp(18px, 4.6vw, 28px);
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .red { color: #C8102E; }
    p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.18em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main class="stage">
    <video id="film" playsinline webkit-playsinline preload="metadata" poster="poster.jpg" controls>
      <source src="video.mp4" type="video/mp4">
    </video>
    <button class="cover" id="play" type="button">
      <span class="mark" aria-hidden="true"><i></i></span>
      <h1>なぜ『失う痛み』は<br><span class="red">二倍</span>なのか</h1>
      <p>画面をタップして再生</p>
    </button>
  </main>
  <script>
    const video = document.getElementById("film");
    const play = document.getElementById("play");
    play.addEventListener("click", function () {
      video.play();
    });
    video.addEventListener("play", function () {
      play.hidden = true;
    });
    video.addEventListener("ended", function () {
      play.hidden = false;
      video.controls = true;
    });
  </script>
</body>
</html>
